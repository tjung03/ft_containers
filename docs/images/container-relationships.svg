<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">ft_containers · 컨테이너 구현 관계</title>
<desc id="desc">ft stack은 기본 컨테이너로 ft vector를 사용한다. ft map은 저장과 재균형을 red_black_tree에 위임하고 red_black_tree는 rb_node를 관리한다.</desc>
