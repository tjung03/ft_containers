<title id="title">ft_containers · 구현 관계</title><desc id="desc">ft stack은 기본 컨테이너로 ft vector를 사용한다. ft map은 red_black_tree에 저장과 재균형을 위임하고 tree는 rb_node를 관리한다. vector와 tree는 iterator.hpp의 전용 iterator를 사용하며, vector와 map은 utils.hpp의 template utility를 사용한다.</desc>
