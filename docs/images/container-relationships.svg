<title id="title">ft_containers · 구현 관계</title><desc id="desc">ft stack은 기본 컨테이너로 ft vector를 사용하고, ft map은 red_black_tree에 저장과 재균형을 맡긴다. vector와 tree는 iterator를 공유하고 vector와 map은 template utility를 사용한다.</desc>
